<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sketch on two maps at a shared ground scale.">
  <meta name="theme-color" content="#f6f9fe">
  <title>Size of My Hometown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-Bzd96RGH.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DK3okSDL.css">
</head>
<body>
  <main>
    <h1 class="page-title">Size of My Hometown</h1>

    <section aria-label="Map comparison" class="workspace">
      <div class="toolbar">
        <div class="segmented units" role="group" aria-label="Map scale units">
          <button type="button" data-unit="metric" aria-label="Kilometers" aria-pressed="true">km</button>
          <button type="button" data-unit="imperial" aria-label="Miles" aria-pressed="false">mi</button>
        </div>
      </div>
      <div class="map-switch segmented" role="group" aria-label="Visible map">
        <button type="button" data-visible-map="0" aria-controls="pane-0" aria-pressed="true"></button>
        <button type="button" data-visible-map="1" aria-controls="pane-1" aria-pressed="false"></button>
      </div>
      <div class="map-grid" id="maps"></div>
      <div class="sketch-tools">
        <div class="segmented" role="group" aria-label="Pen tools">
          <button type="button" data-mode="move" aria-pressed="true">Move</button>
          <button type="button" data-mode="pen" aria-pressed="false" disabled>Pen</button>
          <button type="button" data-mode="adjust" aria-pressed="false" hidden>Adjust</button>
          <button type="button" id="pen-undo" aria-label="Undo pen stroke" disabled>Undo</button>
          <button type="button" id="pen-clear" aria-label="Clear pen strokes" disabled>Clear</button>
        </div>
        <p id="walk-estimate" role="status" title="Straight-line estimate at 5 km/h" hidden></p>
      </div>

    </section>
  </main>

  <template id="map-pane-template">
    <article class="map-pane">
      <div class="pane-heading">
        <div class="place-info">
          <span class="place-dot" aria-hidden="true"></span>
          <div class="place-text">
            <p class="place-role sr-only"></p>
            <h2 class="place-name"></h2>
            <p class="place-region"></p>
          </div>
        </div>
        <details class="search">
          <summary class="search-toggle">Change place</summary>
          <div class="search-panel">
            <form class="search-form" role="search">
              <input type="search" placeholder="Search for a place" autocomplete="off" required minlength="2" aria-label="Search for a place">
              <button type="submit">Find</button>
            </form>
            <p class="search-status" role="status"></p>
            <ul class="search-results"></ul>
          </div>
        </details>
      </div>
      <div class="map-viewport">
        <div class="map-canvas"></div>
        <canvas class="pen-overlay" aria-hidden="true"></canvas>
        <span class="ground-scale" title="Linked ground scale at the map center" hidden></span>
        <p class="map-error" role="status" hidden></p>
      </div>
    </article>
  </template>
</body>
</html>
